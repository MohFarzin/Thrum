services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thrum}
      POSTGRES_USER: ${POSTGRES_USER:-thrum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thrum}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thrum} -d ${POSTGRES_DB:-thrum}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: thrum.settings.production
      DATABASE_URL: ${DATABASE_URL:-postgres://thrum:thrum@db:5432/thrum}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A thrum worker --loglevel=INFO --concurrency=2
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: thrum.settings.production
      DATABASE_URL: ${DATABASE_URL:-postgres://thrum:thrum@db:5432/thrum}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A thrum beat --loglevel=INFO
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: thrum.settings.production
      DATABASE_URL: ${DATABASE_URL:-postgres://thrum:thrum@db:5432/thrum}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  app_data:
